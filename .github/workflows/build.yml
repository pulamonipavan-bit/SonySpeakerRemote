name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk SonySpeakerRemote.apk
          cp kids/build/outputs/apk/debug/kids-debug.apk LittleLearner.apk
          cp speak/build/outputs/apk/debug/speak-debug.apk TalkWithZippy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SonySpeakerRemote-apk
          path: |
            SonySpeakerRemote.apk
            LittleLearner.apk
            TalkWithZippy.apk

      - name: Publish as "latest" release (direct APK download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest SonySpeakerRemote.apk LittleLearner.apk TalkWithZippy.apk --title "Apps" --notes "SonySpeakerRemote.apk = speaker + LG AC remote. LittleLearner.apk = toddler learning game. TalkWithZippy.apk = English speaking practice." --target "$GITHUB_SHA"
