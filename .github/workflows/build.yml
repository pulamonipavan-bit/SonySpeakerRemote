name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk SonySpeakerRemote.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SonySpeakerRemote-apk
          path: SonySpeakerRemote.apk

      - name: Publish as "latest" release (direct APK download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest SonySpeakerRemote.apk --title "Sony Speaker Remote" --notes "Install SonySpeakerRemote.apk on your phone." --target "$GITHUB_SHA"
