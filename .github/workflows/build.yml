name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk SonySpeakerRemote.apk
          cp kids/build/outputs/apk/debug/kids-debug.apk LittleLearner.apk
          cp speak/build/outputs/apk/debug/speak-debug.apk TalkWithZippy.apk

      - name: Build Play Store bundle (signed if the upload key secrets are set)
        env:
          KS_B64: ${{ secrets.ZIPPY_KEYSTORE_B64 }}
          ZIPPY_KEYSTORE_PASSWORD: ${{ secrets.ZIPPY_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            export ZIPPY_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          fi
          gradle :speak:bundleRelease --no-daemon
          cp speak/build/outputs/bundle/release/speak-release.aab TalkWithZippy-release.aab
          rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: TalkWithZippy-PlayStore-bundle
          path: TalkWithZippy-release.aab

      - uses: actions/upload-artifact@v4
        with:
          name: SonySpeakerRemote-apk
          path: |
            SonySpeakerRemote.apk
            LittleLearner.apk
            TalkWithZippy.apk

      - name: Publish as "latest" release (direct APK download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest SonySpeakerRemote.apk LittleLearner.apk TalkWithZippy.apk --title "Apps" --notes "SonySpeakerRemote.apk = speaker + LG AC remote. LittleLearner.apk = toddler learning game. TalkWithZippy.apk = English speaking practice." --target "$GITHUB_SHA"
